name: Build UF2 Image

on:
    push:
        branches: [ main, develop ]
    pull_request:
        branches: [ main, develop ]
    workflow_dispatch:
        # Allows manual triggering

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout lx-euclid repository
              uses: actions/checkout@v4
              with:
                  lfs: true

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.x"

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential libffi-dev git cmake gcc-arm-none-eabi libnewlib-arm-none-eabi python3-pip

            - name: Clone MicroPython repository
              run: |
                  git clone https://github.com/micropython/micropython.git --branch v1.27.0

            - name: Build MicroPython submodules
              run: |
                  cd micropython
                  make -C ports/rp2 submodules

            - name: Clone dir2uf2 tool
              run: |
                  git clone https://github.com/Gadgetoid/dir2uf2.git

            - name: Install dir2uf2 dependencies
              run: |
                  cd dir2uf2
                  pip3 install -r requirements-micropython-1.23.0.txt

            - name: Set up environment variables
              run: |
                  echo "LX_EUCLID_REPO_DIRECTORY=$GITHUB_WORKSPACE" >> $GITHUB_ENV
                  echo "MICROPYTHON_DIRECTORY=$GITHUB_WORKSPACE/micropython" >> $GITHUB_ENV
                  echo "DIR_2_UF2_FOLDER=$GITHUB_WORKSPACE/dir2uf2" >> $GITHUB_ENV
                  echo "UF2_OUTPUT_FILE=$GITHUB_WORKSPACE/lx-euclid-firmware.uf2" >> $GITHUB_ENV
                  echo "MICROPYTHON_RP2_DIRECTORY=$GITHUB_WORKSPACE/micropython/ports/rp2" >> $GITHUB_ENV
                  echo "MICROPYTHON_RP2_MODULE_DIRECTORY=$GITHUB_WORKSPACE/micropython/ports/rp2/modules" >> $GITHUB_ENV
                  echo "BINARY_FOLDER=binaries" >> $GITHUB_ENV
                  echo "LX_EUCLID_BIN_DIRECTORY=$GITHUB_WORKSPACE/binaries" >> $GITHUB_ENV
                  echo "DIR_2_UF2_NO_FILESYSTEM_FILE=$GITHUB_WORKSPACE/dir2uf2/lx-euclid-firmware.uf2" >> $GITHUB_ENV
                  echo "DIR_2_UF2_W_FILESYSTEM_FILE=$GITHUB_WORKSPACE/dir2uf2/lx-euclid-firmware-filesystem.uf2" >> $GITHUB_ENV

            - name: Copy Python files to MicroPython modules
              run: |
                  # Copy Python files to MicroPython modules
                  mkdir -p "$MICROPYTHON_RP2_MODULE_DIRECTORY"
                  echo "Copying Python files from $LX_EUCLID_REPO_DIRECTORY to $MICROPYTHON_RP2_MODULE_DIRECTORY"
                  find "$LX_EUCLID_REPO_DIRECTORY" -type f -name "*.py" -not -path "*/.git/*" -not -path "*/micropython/*" -not -path "*/tmp/*" | while read -r file; do
                      relative_path="${file#$LX_EUCLID_REPO_DIRECTORY/}"
                      mkdir -p "$MICROPYTHON_RP2_MODULE_DIRECTORY/$(dirname "$relative_path")"
                      cp "$file" "$MICROPYTHON_RP2_MODULE_DIRECTORY/$relative_path"
                  done

            - name: Build MicroPython UF2
              run: |
                  cd $MICROPYTHON_RP2_DIRECTORY

                  # Build with custom modules
                  echo "Building UF2 with custom modules..."
                  make BOARD=RPI_PICO -j$(nproc) V=1

                  # Copy uf2 file to dir2uf2 folder
                  cp ./build-RPI_PICO/firmware.uf2 $DIR_2_UF2_NO_FILESYSTEM_FILE

            - name: Create UF2 with filesystem
              run: |
                  cd $DIR_2_UF2_FOLDER

                  # Create binary folder and copy binaries
                  mkdir -p $BINARY_FOLDER
                  if [ -d "$LX_EUCLID_BIN_DIRECTORY" ]; then
                      cp -a $LX_EUCLID_BIN_DIRECTORY ./
                      echo "Copied binaries from $LX_EUCLID_BIN_DIRECTORY to $BINARY_FOLDER"
                      echo "Contents of $BINARY_FOLDER:"
                      ls -l $BINARY_FOLDER
                  else
                      echo "Warning: Binary directory not found, creating empty binary folder"
                  fi

                  # Create the final UF2 image with filesystem
                  python3 dir2uf2 ./$BINARY_FOLDER --append-to $DIR_2_UF2_NO_FILESYSTEM_FILE --fs-compact

                  # Copy the final UF2 to output location
                  cp $DIR_2_UF2_W_FILESYSTEM_FILE $UF2_OUTPUT_FILE

            - name: Install documentation dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pandoc texlive-latex-base texlive-fonts-recommended texlive-latex-extra

            - name: Generate PDF documentation
              run: |
                  cd docs
                  if [ -f "EEPROM_Structure.md" ]; then
                      echo "📄 Converting EEPROM_Structure.md to PDF..."
                      GIT_HASH=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
                      GIT_HASH_TEX=$(mktemp /tmp/git_hash_XXXXXX.tex)
                      echo "\\newcommand{\\gitHash}{${GIT_HASH}}" > "${GIT_HASH_TEX}"
                      pandoc EEPROM_Structure.md \
                        -o EEPROM_Structure.pdf \
                        --pdf-engine=pdflatex \
                        --include-in-header="${GIT_HASH_TEX}" \
                        --include-in-header header_footer.tex \
                        --variable geometry:"top=1in,bottom=1in,left=1in,right=1in" \
                        --variable fontsize=7pt \
                        --variable documentclass=article \
                        --variable classoption="a4paper" \
                        --variable tables=true \
                        --variable colorlinks=true \
                        --wrap=preserve
                      echo "✅ PDF generated successfully!"
                      ls -la EEPROM_Structure.pdf
                  else
                      echo "❌ EEPROM_Structure.md not found in docs directory"
                      exit 1
                  fi

            - name: Get commit info for artifact name
              id: commit
              run: |
                  echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

            - name: Upload UF2 artifact
              uses: actions/upload-artifact@v4
              with:
                  name: lx-euclid-firmware-${{ steps.commit.outputs.timestamp }}-${{
                      steps.commit.outputs.short_sha }}
                  path: lx-euclid-firmware.uf2
                  retention-days: 90

            - name: Upload PDF documentation artifact
              uses: actions/upload-artifact@v4
              with:
                  name: lx-euclid-docs-${{ steps.commit.outputs.timestamp }}-${{
                      steps.commit.outputs.short_sha }}
                  path: docs/EEPROM_Structure.pdf
                  retention-days: 90

            - name: Create release on tag
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              with:
                  files: |
                      lx-euclid-firmware.uf2
                      docs/EEPROM_Structure.pdf
                  name: Release ${{ github.ref_name }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
